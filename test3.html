<script>
const data=[{"id": 1, "q": "Вал турбокомпрессора, устанавливаемый в системе питания дизеля, приводится во вращение...", "a": "энергией отработавших газов"}, {"id": 2, "q": "Виды двигателей внутреннего сгорания в зависимости от типа топлива.", "a": "бензиновые, дизельные и газовые."}, {"id": 3, "q": "В каких единицах измеряется гидравлическое давление?", "a": "в единицах силы, деленной на площадь (Па), (Атм)"}, {"id": 4, "q": "В какой последовательности происходят такты в 4-х тактном ДВС?", "a": "впуск, сжатие, рабочий ход (сгорание и расширение), выпуск. "}, {"id": 5, "q": "В трехфазную сеть 380 В включают трехфазный двигатель, каждая из обмоток которого рассчитана на 220 В. Как следует соединить обмотки двигателя?", "a": "Обмотки двигателя следует соединить по схеме \"звезда\"."}, {"id": 6, "q": "Где образуется рабочая смесь в дизельном двигателе.", "a": "непосредственно в цилиндре"}, {"id": 7, "q": "Датчик, неисправность которого повлечет остановку двигателя с системой впрыска и невозможность вновь пустить его:", "a": "датчик положения коленчатого вала. "}, {"id": 8, "q": "Для выпрямления переменного напряжения применяют:", "a": "выпрямители"}, {"id": 9, "q": "Для чего нужна блокировка в ГТР?", "a": "для повышения эффективности работы трансмиссии и улучшения топливной экономичности"}, {"id": 10, "q": "Единица давления 1 бар?", "a": "равен атмосферному давлению"}, {"id": 11, "q": "Если заменить  гидроцилиндр  меньшего  диаметра  большим, как изменится  скорость  движения  гидроцилиндра", "a": "уменьшится,"}, {"id": 12, "q": "За счет чего воспламеняется горючая смесь в дизельном двигателе?", "a": "самовоспламенения от сжатия воздуха"}, {"id": 13, "q": "За счет чего производится очистка масла в центробежном фильтре тонкой очистки", "a": "центробежной силы"}, {"id": 14, "q": "За счет чего происходит впрыск топлива в инжекторе.", "a": "создания высокого давления в топливной системе и последующего распыления топлива в впускной коллектор или непосредственно в камеру сгорания через форсунки"}, {"id": 15, "q": "За счет чего циркулирует жидкость в принудительной системе охлаждения.", "a": "за счет работы водяного насоса (помпы)"}, {"id": 16, "q": "За счет чего циркулирует жидкость в системе охлаждения ДВС.", "a": "водяным насосом"}, {"id": 17, "q": "Из каких основных частей состоит автомобиль", "a": "кузова, шасси и двигателя"}, {"id": 18, "q": "Какая из перечисленных неисправностей не может быть причиной снижения давления впрыска топлива?", "a": "износ плунжера"}, {"id": 19, "q": "Какая из функций не может быть обеспечена гидравлическим замком?", "a": "защита от перегрузки крана."}, {"id": 20, "q": "Какие детали и поверхности деталей смазываются под давлением?", "a": "Шатунные и коренные подшипники коленвала, подшипники распредвала, винтовые шестерни масляного насоса "}, {"id": 21, "q": "Какие детали соединяет шатун.", "a": "поршень и коленчатый вал двигателя"}, {"id": 22, "q": "Какие из перечисленных функций не выполняют смазочные системы?", "a": "вынос продуктов износа и обеспечение оптимального теплового режима работы двигателя"}, {"id": 23, "q": "Какие приборы способны измерить напряжение в электрической цепи?", "a": "вольтметр и мультиметр."}, {"id": 24, "q": "Какие трансформаторы используются для питания электроэнергией в быту?", "a": "распределительные трансформаторы"}, {"id": 25, "q": "Каким инструментом проверяется момент затяжки резьбовых соединений?", "a": "динамометрическим ключом"}, {"id": 26, "q": "Какими приборами можно измерить силу тока в электрической цепи?", "a": "амперметр"}, {"id": 27, "q": "Каким прибором измеряется гидравлическое давление?", "a": "манометр"}, {"id": 28, "q": "Каким способом проверяют натяжение приводного ремня?", "a": "путем надавливания на него между шкивами и измерения прогиба ремня"}, {"id": 29, "q": "Каким способом смазываются наиболее нагруженные детали ДВС.", "a": "под давлением через масляную систему"}, {"id": 30, "q": "Каково назначение диодного моста?", "a": "для преобразования переменного тока в постоянный"}, {"id": 31, "q": "Каково назначение механических  передач?", "a": "для передачи и преобразования механической энергии от источника (например, двигателя) к исполнительному механизму, часто с изменением характера движения, такого как скорость, крутящий момент или направление вращения. "}, {"id": 32, "q": "Каковы наиболее вероятные последствия неравномерной подачи топлива форсункам?", "a": "снижение мощности, увеличение расхода топлива, проблемы с запуском, неустойчивую работу на холостом ходу, а также повышенный износ и риск перегрева двигателя. "}, {"id": 33, "q": "Каковы наиболее вероятные последствия снижения давления впрыска топлива?", "a": "ухудшение запуска двигателя, неустойчивая работа на холостом ходу, снижение мощности и приемистости, увеличение расхода топлива, а также возможные проблемы с выхлопом и работой каталитического нейтрализатора. "}, {"id": 34, "q": "Какое движение совершает плунжер в топливном насосе высокого давления.", "a": "возвратно-поступательное движение внутри втулки"}, {"id": 35, "q": "Какое значение имеет давление открытия форсунки в дизельном двигателе.", "a": "играет ключевую роль в эффективности сгорания топлива и, следовательно, в работе двигателя"}, {"id": 36, "q": "Какое назначение имеет турбокомпрессор, применяемый в системе питания дизеля?", "a": " наращивании подачи воздушно-топливной смеси в камеры сгорания."}, {"id": 37, "q": "Какой вид уплотнений применяют в торцовых соединениях гидравлических систем, работающих на больших давлениях?", "a": " двойные торцевые уплотнения типа \"тандем\"."}, {"id": 38, "q": "Какой зазор между плунжером и гильзой в топливном насосе высокого давления.", "a": "1-3 микрона (мкм)"}, {"id": 39, "q": "Какой из проводов одинаково диаметра и длины сильнее нагревается – медный или стальной?", "a": "Стальной провод "}, {"id": 40, "q": "Какой прибор нельзя подключить к измерительной обмотке трансформатора тока?", "a": "прибор, который создаст высокое сопротивление или разомкнет цепь.( вольтметр)"}, {"id": 41, "q": "Какой способ соединения источников позволяет увеличить напряжение?", "a": "последовательное"}, {"id": 42, "q": "Какую роль в гидравлических и пневматических приводах играет золотник?", "a": "служат управляющим элементом, который направляет поток рабочей жидкости или сжатого воздуха"}, {"id": 43, "q": "Компрессия — характеризует", "a": "максимальное давление топливовоздушной смеси в цилиндре в конце такта сжатия"}, {"id": 44, "q": "Контрольная лампа CHECK ENGINE («Проверьте двигатель») указывает:", "a": "наличие неисправности в одной из систем двигателя или в связанных с ним системах"}, {"id": 45, "q": "К чему крепиться поршень.", "a": "к шатуну"}, {"id": 46, "q": "К чему может привести поломка термостата.", "a": "перегреву или, наоборот, недостаточному прогреву двигателя"}, {"id": 47, "q": "К чему приводит низкое давление турбокомпрессора?", "a": "к снижению мощности и ухудшению динамики разгона автомобиля"}, {"id": 48, "q": "Назначение аккумуляторной батареи в автомобиле.", "a": "обеспечение запуска двигателя и питание бортовой сети при неработающем генераторе"}, {"id": 49, "q": "Назначение диффузора  на  дизельных автомашинах?", "a": "является частью системы охлаждения двигателя и выполняет функцию улучшения аэродинамики и повышения эффективности работы вентилятора"}, {"id": 50, "q": "Назначение зарядного устройства в тормозных системах  подземных машин?", "a": "для пополнения сжатого воздуха в пневматической системе"}, {"id": 51, "q": "Назначение маховика?", "a": "обеспечением равномерного вращения коленчатого вала и передачей крутящего момента. "}, {"id": 52, "q": "Назначение редукционного клапана в гидравлической системе?", "a": "для снижения и поддержания давления рабочей жидкости на заданном уровне, более низком, чем в основной линии системы. О"}, {"id": 53, "q": "Назначение редукционного клапана масленого насоса?", "a": "для поддержания оптимального давления масла в системе смазки двигателя, сбрасывая излишки масла обратно в поддон, когда давление превышает заданный уровень."}, {"id": 54, "q": "Назначение реле-регулятора генератора.", "a": "для поддержания стабильного напряжения в автомобильной электрической системе, независимо от скорости вращения двигателя и нагрузки"}, {"id": 55, "q": "Назначение сервонасоса на ПДМ?", "a": "для точного управления гидравлическими функциями, такими как управление ковшом, стрелой и другими механизмами. "}, {"id": 56, "q": "Назначение системы сервоуправления в гидравлических системах?", "a": "для точного и быстрого регулирования скорости, положения, силы или других параметров выходных элементов системы, таких как гидроцилиндры или гидравлические двигатели, путем обратной связи"}, {"id": 57, "q": "Назначение термостата.", "a": "для поддержания заданной температуры в различных системах и устройствах"}, {"id": 58, "q": "Назначение ТНВД.", "a": "для подачи топлива в цилиндры дизельного двигателя под высоким давлением и в определенный момент времени. "}, {"id": 59, "q": "Назначение форсунки в дизельном двигателе.", "a": "подача топлива в камеру сгорания, а также его точная дозировка и распыление."}, {"id": 60, "q": "Основными системами, «отвечающими» за пуск и работу двигателя, являются:", "a": "система пуска, система зажигания и система подачи топлива"}, {"id": 61, "q": "От чего зависит напряжение, вырабатываемое генератором.", "a": "скорости вращения ротора генератора и силы магнитного поля в обмотке возбуждения"}, {"id": 62, "q": "Перечислите детали которые входят в кривошипно-шатунный механизм.", "a": "коленвал, маховик, поршень и поршневые кольца, шатунные элементы"}, {"id": 63, "q": "Перечислите наиболее вероятные причины перегрева двигателя.", "a": "недостаточный уровень охлаждающей жидкости, неисправность термостата, проблемы с радиатором, неисправность водяного насоса, неисправность вентилятора, а также проблемы с системой смазки. "}, {"id": 64, "q": "Перечислите основные детали ДВС.", "a": "блок цилиндров, головку блока цилиндров, поршни, шатуны, коленчатый вал, распределительный вал, клапаны, свечи зажигания (в бензиновых двигателях) и форсунки (в дизельных двигателях)"}, {"id": 65, "q": "Перечислите способы подачи масла к трущимся частям ДВС. Тесты на знание устройства автомобиля.", "a": "разбрызгиванием и масляным туманом, под давлением и комбинированным методом. "}, {"id": 66, "q": "При уменьшении упругости пружины форсунки давление впрыска топлива...", "a": "снижается"}, {"id": 67, "q": "Причина выхода из строя гидравлических насосов?", "a": "механический износ, загрязнение гидравлической жидкости, перегрев, неисправности системы управления, а также неправильную эксплуатацию и обслуживание"}, {"id": 68, "q": "Причина отсутствия тормозов на ГШО?", "a": "неисправность главного тормозного цилиндра, попадание воздуха в тормозную систему, утечка тормозной жидкости или износ тормозных колодок"}, {"id": 69, "q": "Причины перегрева двигателя:", "a": "недостаточный уровень охлаждающей жидкости, неисправности системы охлаждения (термостат, помпа, радиатор, вентилятор), а также проблемы с двигателем, такие как неправильное сгорание топлива или утечка охлаждающей жидкости. "}, {"id": 70, "q": "Причины появления белого дыма отработавших газов:", "a": "попадание охлаждающей жидкости (антифриза) в камеру сгорания или конденсацией водяного пара"}, {"id": 71, "q": "Причины появления голубого (сизого) дыма отработавших газов:", "a": "попадание моторного масла в камеру сгорания и его последующее сгорание. "}, {"id": 72, "q": "Причины появления черного дыма отработавших газов:", "a": "неполное сгорание топлива, вызванное избытком топлива или недостатком воздуха в топливно-воздушной смеси"}, {"id": 73, "q": "Рабочая температура жидкости в гидравлических системах?", "a": "от 30°C до 60°C ."}, {"id": 74, "q": "Расшифруйте аббревиатуру ЭДС", "a": "электродвижущая сила"}, {"id": 75, "q": "Синхронные двигатели относятся к двигателям:", "a": "переменного тока."}, {"id": 76, "q": "Составляющие ходовой части", "a": "рама, мосты, подвеска и колеса,  шины и диски. "}, {"id": 77, "q": "Трансмиссия состоит из:", "a": "сцепление, коробка передач, главная передача, дифференциал и приводные валы."}, {"id": 78, "q": "Чему равняется степень сжатия в дизельном двигателе.", "a": "от 14:1 до 25:1. "}, {"id": 79, "q": "Что входит в большой круг циркуляции жидкости в системе охлаждения ДВС.", "a": "рубашка охлаждения двигателя, водяной насос, радиатор, термостат и расширительный бачок. "}, {"id": 80, "q": "Что входит в малый круг циркуляции жидкости в системе охлаждения ДВС.", "a": "рубашка охлаждения двигателя, водяной насос (помпа), термостат и радиатор отопителя"}, {"id": 81, "q": "Что входит в систему питания дизельного двигателя.", "a": "топливный бак, фильтры грубой и тонкой очистки, топливоподкачивающий насос, топливный насос высокого давления (ТНВД), форсунки, трубопроводы низкого и высокого давления. "}, {"id": 82, "q": "Что входит в систему питания дизельного двигателя?", "a": "насос подкачки, бак для топлива, фильтры тонкой и грубой очистки, топливопроводы, ТНВД, форсунки, электромагнитный клапан и обратный трубопровод"}, {"id": 83, "q": "Что зажигает газ в дизельном двигателе при переводе его на газ.", "a": "дизельное топливо"}, {"id": 84, "q": "Что называется рабочим объемом цилиндра?", "a": "объем, образованный перемещением поршня от нижней мертвой точки (НМТ) до верхней мертвой точки (ВМТ). "}, {"id": 85, "q": "Что показывает степень сжатия?", "a": "во сколько раз объем рабочей смеси в цилиндре двигателя уменьшается при перемещении поршня из нижней мертвой точки (НМТ) в верхнюю мертвую точку (ВМТ)"}, {"id": 86, "q": "Что такое кавитация?", "a": "физический процесс образования и последующего схлопывания пузырьков в жидкости, вызванное локальным понижением давления. "}, {"id": 87, "q": "Что является вращающейся частью в асинхронном двигателе?", "a": "ротор"}, {"id": 88, "q": "Что является основными деталями ТНВД.", "a": "корпус, кулачковый вал, плунжерные пары, нагнетательные клапаны, всережимный регулятор, насос подкачки, толкатели и возвратные пружины"}, {"id": 89, "q": "Шасси включает в себя:", "a": "раму (или несущий кузов), подвеску, трансмиссию, рулевое управление, тормозную систему, колеса и оси."}, {"id": 90, "q": "Электронные устройства, преобразующие постоянное напряжение в переменное, называются:", "a": "инверторами или преобразователями DC/AC"}];
let deck=[],i=0,score=0,answered=false;
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){deck=shuffle(data);i=0;score=0;render()}
function render(){
 answered=false; const x=deck[i];
 document.getElementById('stats').textContent=`Вопрос ${i+1} из ${deck.length} · Правильных: ${score}`;
 document.getElementById('bar').style.width=((i)/deck.length*100)+'%';
 document.getElementById('q').textContent=x.q;
 document.getElementById('ans').style.display='none'; document.getElementById('ans').textContent=x.a;
